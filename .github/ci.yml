name: CI/CD - Churn Prediction Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  PYTHONPATH: src
  IMAGE_NAME: churn-api

jobs:
  train-and-test:
    name: Train model, run tests, check drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Download real Telco Customer Churn dataset
        run: |
          mkdir -p data
          curl -sf https://raw.githubusercontent.com/IBM/telco-customer-churn-on-icp4d/master/data/Telco-Customer-Churn.csv -o data/telco_raw.csv
          python src/training/prepare_real_data.py

      - name: Train model on real customer data + log to MLflow
        run: python src/training/train.py --data-path data/customer_churn_real.csv --experiment-name customer-churn-prediction-real

      - name: Upload training artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-and-metrics
          path: |
            models/model.pkl
            models/feature_schema.json
            reports/training_metrics.json
            mlruns/

      - name: Run pytest suite (API contract + prediction sanity)
        run: pytest tests/ -v --cov=src/serving --cov-report=term-missing

      - name: Run drift detection (Evidently)
        run: python src/monitoring/drift_detection.py
        continue-on-error: false

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: |
            reports/drift_report.html
            reports/drift_summary.json

      - name: Fail pipeline on critical drift
        run: |
          python -c "
          import json, sys
          with open('reports/drift_summary.json') as f:
              summary = json.load(f)
          print(json.dumps(summary, indent=2))
          if summary['severity'] == 'critical':
              print('Critical drift detected - failing pipeline')
              sys.exit(1)
          "

  build-and-smoke-test:
    name: Build Docker image and smoke test
    runs-on: ubuntu-latest
    needs: train-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download trained model artifact
        uses: actions/download-artifact@v4
        with:
          name: model-and-metrics
          path: .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} -t ${{ env.IMAGE_NAME }}:latest .

      - name: Smoke test the container
        run: |
          docker run -d --name churn-api-smoke -p 8000:8000 ${{ env.IMAGE_NAME }}:latest
          echo "Waiting for the API to become healthy..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/health; then
              echo "API is healthy"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "API did not become healthy in time"
              docker logs churn-api-smoke
              exit 1
            fi
            sleep 3
          done

          echo "Hitting /predict ..."
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{
              "customer_id": "SMOKE-TEST",
              "tenure_months": 2,
              "contract_type": "Month-to-month",
              "monthly_charges": 95.5,
              "total_charges": 191.0,
              "num_support_tickets": 5,
              "has_tech_support": 0,
              "has_online_security": 0,
              "internet_service": "Fiber optic",
              "payment_method": "Electronic check",
              "paperless_billing": 1,
              "senior_citizen": 0,
              "partner": 0,
              "dependents": 0,
              "num_additional_services": 0,
              "avg_monthly_usage_gb": 210.5
            }' | tee /tmp/predict_response.json

          python -c "
          import json
          with open('/tmp/predict_response.json') as f:
              resp = json.load(f)
          assert 0.0 <= resp['churn_probability'] <= 1.0
          assert resp['risk_tier'] in {'low', 'medium', 'high'}
          print('Smoke test passed:', resp)
          "

      - name: Check /metrics is Prometheus-formatted
        run: |
          curl -sf http://localhost:8000/metrics | grep -q 'churn_predictions_total'

      - name: Tear down smoke-test container
        if: always()
        run: docker rm -f churn-api-smoke || true

  deploy:
    name: Deploy to Kubernetes (placeholder)
    runs-on: ubuntu-latest
    needs: build-and-smoke-test
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # In a real cluster this step would authenticate to the target
      # cluster (e.g. via a kubeconfig secret or a cloud provider action)
      # and apply the manifests below. Left as an explicit placeholder so
      # it's obvious what needs cluster credentials wired in before this
      # becomes a real deploy step.
      - name: Deploy to Kubernetes (placeholder - requires cluster credentials)
        run: |
          echo "This step is a placeholder for a real deployment target."
          echo "To wire it up:"
          echo "  1. Add a KUBE_CONFIG secret with your cluster's kubeconfig"
          echo "  2. Uncomment the steps below"
          echo ""
          echo "# - uses: azure/setup-kubectl@v4"
          echo "# - run: echo \"\$KUBE_CONFIG\" > kubeconfig.yaml"
          echo "# - run: kubectl --kubeconfig=kubeconfig.yaml apply -f k8s/service.yaml"
          echo "# - run: kubectl --kubeconfig=kubeconfig.yaml apply -f k8s/deployment.yaml"
          echo "# - run: kubectl --kubeconfig=kubeconfig.yaml apply -f k8s/hpa.yaml"
          echo "# - run: kubectl --kubeconfig=kubeconfig.yaml -n churn-prediction rollout status deployment/churn-api"
