apiVersion: v1
kind: Namespace
metadata:
  name: churn-prediction
---
apiVersion: v1
kind: Service
metadata:
  name: churn-api
  namespace: churn-prediction
  labels:
    app: churn-api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8000"
spec:
  type: ClusterIP
  selector:
    app: churn-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: churn-api-nodeport
  namespace: churn-prediction
  labels:
    app: churn-api
spec:
  type: NodePort
  selector:
    app: churn-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      nodePort: 30080
